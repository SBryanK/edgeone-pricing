worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Real IPs / logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # DNS resolver is required for dynamic proxy_pass with variables. The
    # primary resolvers are the internal Tencent corp DNS servers present on
    # DevCloud VMs (matching what /etc/resolv.conf inside the container
    # shows). The public resolvers at the tail are a best-effort fallback
    # should those be unreachable (e.g. on a developer laptop).
    resolver 9.218.233.130 9.218.230.76 10.123.120.110 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Upstream host lives in a variable so the address is resolved via the
    # resolver above at request time (nginx would otherwise try to resolve
    # at startup and fail if DNS is slow).
    # NOTE: we deliberately DO NOT bake the upstream TLS cert into the image.

    # Run as non-privileged port; host maps 80 -> 8080.
    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ------------------------------------------------------------------
        # AI Assistant reverse proxy
        # ------------------------------------------------------------------
        # The browser posts a Claude Messages API body to /api/ai/chat; we
        # relay it 1:1 to api.anthropic.com after injecting auth headers. The
        # API key comes from the ANTHROPIC_API_KEY env var, substituted into
        # this file at container start by envsubst.
        location = /api/ai/chat {
            # Reject non-POST requests cheaply without a DNS lookup.
            limit_except POST { deny all; }

            # Fail closed when the key is missing: return a clear JSON error
            # instead of forwarding the request (which would 401 upstream
            # anyway but with a less helpful body).
            if ($ai_api_key = "") {
                add_header Content-Type "application/json" always;
                return 503 '{"error":{"type":"not_configured","message":"AI assistant is not configured on this server (ANTHROPIC_API_KEY missing)."}}';
            }

            # Strip inbound auth-ish headers from the client to avoid ever
            # passing user-supplied credentials upstream.
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";

            # Upstream auth + required versioning header.
            proxy_set_header x-api-key $ai_api_key;
            proxy_set_header anthropic-version "2023-06-01";
            proxy_set_header Content-Type "application/json";
            proxy_set_header Host "api.anthropic.com";
            proxy_set_header Accept "application/json";
            proxy_set_header User-Agent "edgeone-pricing-calculator/1.0";

            # Use a variable target so nginx DNS-resolves at request time
            # (required for dynamic upstreams behind Cloudflare etc.).
            set $anthropic_upstream "https://api.anthropic.com";
            proxy_pass $anthropic_upstream/v1/messages;

            # TLS handshake to upstream: verify server, use SNI.
            proxy_ssl_server_name on;
            proxy_ssl_name api.anthropic.com;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_verify off; # upstream cert chain is managed by CF; relax for zero-deps alpine

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Anthropic can take a few seconds to stream a completion.
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Limit how big a request body we accept (the catalog-stuffed
            # system prompt is ~5 kB, user query capped at 1 kB client-side).
            client_max_body_size 64k;
            client_body_buffer_size 64k;

            # Never log the api key or user prompts. The log_format above
            # does not include request bodies, so we're fine, but turn off
            # access logs on this route as an extra precaution.
            access_log off;
        }

        # Long-lived caching for build assets (Vite adds content hashes to filenames)
        location ~* \.(?:js|css|woff2?|ttf|eot|otf|ico|png|jpg|jpeg|gif|svg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        # Lightweight healthcheck (used by Docker HEALTHCHECK & compose)
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Security headers
        add_header X-Frame-Options         "SAMEORIGIN"              always;
        add_header X-Content-Type-Options  "nosniff"                 always;
        add_header X-XSS-Protection        "1; mode=block"           always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

        # Block hidden files (dotfiles)
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # Expose the API key as an nginx variable so both the `if` guard and
    # the proxy_set_header line above can read it. `${...}` is substituted
    # by envsubst at container start (see Dockerfile).
    map "" $ai_api_key {
        default "${ANTHROPIC_API_KEY}";
    }
}